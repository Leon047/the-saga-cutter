Instructions=Project TheSagaCutter: a Viking-themed colony sim made for a game jam (UE 5.9, C++ module TheSagaCutter plus Blueprints). Keep game content under /Game/Vikings/{Maps,Characters,Buildings,Environment,UI,Data,Blueprints}. The default map is /Game/Vikings/Maps/Map_Fjord. C++ classes use the TSC prefix (ATSCGameMode, ATSCColonyCameraPawn, ATSCColonist, ATSCBuildingSite); gameplay tags live under Colony.Job.* and Colony.Resource.*. Asset prefixes: BP_ Blueprint, M_ Material, MI_ Material instance, SM_ Static mesh, SK_ Skeletal mesh, T_ Texture, WBP_ Widget, DA_ Data asset, ST_ StateTree. Prefer small, jam-sized changes and save assets after editing.
